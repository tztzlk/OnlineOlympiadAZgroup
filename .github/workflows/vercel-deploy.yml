# Выкладка на Vercel после каждого push в main.
# Нужен секрет репозитория VERCEL_TOKEN (vercel.com → Account Settings → Tokens).
# Без секрета задача пропускается и не падает.
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: team_gI2yudWzyq80Clb5ZJHSin0c
      VERCEL_PROJECT_ID: prj_npHyIyvnJ06JRqQdiG83nxsx8vMV
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check token
        id: token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Секрет VERCEL_TOKEN не задан — выкладка пропущена."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.token.outputs.present == 'true'

      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true'
        with:
          node-version: 22

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
